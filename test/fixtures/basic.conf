# a small legacy config
$mainMod = SUPER

general {
    gaps_in = 5
    gaps_out = 5,10,5,10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    blur {
        enabled = yes
        size = 3
    }
}

misc {
    force_default_wallpaper = -1
    vfr = true
}

exec-once = waybar & hyprpaper
exec-once = nm-applet --indicator
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
bezier = easeOutQuint, 0.23, 1, 0.32, 1
animation = windows, 1, 4.79, easeOutQuint
animation = fade, 0, 1, default
plugin = /path/to/plugin.so
permission = /usr/(bin|local/bin)/grim, screencopy, allow

windowrule = float true, match:class ^(pavucontrol)$
windowrule = size 800 600, match:class ^(pavucontrol)$
windowrule = opacity 0.9, match:title ^(.*Firefox.*)$
layerrule = blur true, match:namespace ^(waybar)$
