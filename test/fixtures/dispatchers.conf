# One bind per dispatcher the converter knows how to translate.
#
# This exists so that Hyprland itself checks the whole dispatcher table: the CI job runs
# `Hyprland --verify-config` over the converted output, and every call below has to be one
# the current hl.dsp API accepts. A dispatcher added to src/handlers/Binds.cpp without a
# line here is a dispatcher nothing verifies.

$mod = SUPER

bind = $mod, A, exec, kitty
bind = $mod, B, execr, kitty
bind = $mod, C, killactive
bind = $mod, D, forcekillactive
bind = $mod, E, closewindow, class:^(foo)$
bind = $mod, F, killwindow, class:^(foo)$
bind = $mod, G, signal, 9
bind = $mod, H, signalwindow, class:^(foo)$,9
bind = $mod, I, togglefloating
bind = $mod, J, setfloating
bind = $mod, K, settiled
bind = $mod, L, workspace, 3
bind = $mod, M, renameworkspace, 3 code
bind = $mod, N, fullscreen, 1
bind = $mod, O, fullscreenstate, 2 0
bind = $mod, P, movetoworkspace, 4
bind = $mod, Q, movetoworkspacesilent, special:magic
bind = $mod, R, pseudo
bind = $mod, S, movefocus, l
bind = $mod, T, movewindow, r
bind = $mod, U, swapwindow, u
bind = $mod, V, centerwindow
bind = $mod, W, togglegroup
bind = $mod, X, changegroupactive, f
bind = $mod, Y, movegroupwindow, b
bind = $mod, Z, focusmonitor, DP-1
bind = $mod, F1, movecursortocorner, 0
bind = $mod, F2, movecursor, 100 200
bind = $mod, F3, exit
bind = $mod, F4, movecurrentworkspacetomonitor, DP-1
bind = $mod, F5, focusworkspaceoncurrentmonitor, 2
bind = $mod, F6, moveworkspacetomonitor, 3 DP-1
bind = $mod, F7, togglespecialworkspace, magic
bind = $mod, F8, forcerendererreload
bind = $mod, F9, resizeactive, 10 0
bind = $mod, F10, moveactive, 10 0
bind = $mod, F11, cyclenext, prev tiled
bind = $mod, F12, focuswindow, class:^(kitty)$
bind = $mod ALT, A, tagwindow, code
bind = $mod ALT, B, toggleswallow
bind = $mod ALT, C, submap, resize
bind = $mod ALT, D, pass, class:^(foo)$
bind = $mod ALT, E, sendshortcut, CTRL, C, class:^(foo)$
bind = $mod ALT, F, sendkeystate, CTRL, C, down, class:^(foo)$
bind = $mod ALT, G, layoutmsg, togglesplit
bind = $mod ALT, H, dpms, off DP-1
bind = $mod ALT, I, movewindowpixel, 10 20,class:^(foo)$
bind = $mod ALT, J, resizewindowpixel, 10 20,class:^(foo)$
bind = $mod ALT, K, swapnext, prev
bind = $mod ALT, L, swapactiveworkspaces, DP-1 DP-2
bind = $mod ALT, M, pin
bind = $mod ALT, N, bringactivetotop
bind = $mod ALT, O, alterzorder, top, class:^(foo)$
bind = $mod ALT, P, focusurgentorlast
bind = $mod ALT, Q, focuscurrentorlast
bind = $mod ALT, R, lockgroups, lock
bind = $mod ALT, S, lockactivegroup, toggle
bind = $mod ALT, T, moveintogroup, l
bind = $mod ALT, U, moveintoorcreategroup, r
bind = $mod ALT, V, moveoutofgroup
bind = $mod ALT, W, movewindoworgroup, d
bind = $mod ALT, X, denywindowfromgroup, toggle
bind = $mod ALT, Y, event, myevent
bind = $mod ALT, Z, global, myplugin:myglobal
bind = $mod CTRL, A, setprop, class:^(foo)$, opaque 1
bind = $mod CTRL, B, forceidle, 5
bind = $mod CTRL, C, releaseinputcapture
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
