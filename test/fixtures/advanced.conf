# monitorv2 blocks, gestures, submaps, devices
monitorv2 {
    output = DP-2
    mode = 3440x1440@175
    position = auto
    scale = 1
    vrr = 1
    addreserved = 10 10 0 0
}

gesture = 3, horizontal, workspace
gesture = 4, up, special, magic
gesturep = 3, pinchin, close

submap = resize
bind = , right, resizeactive, 10 0
bind = , left, resizeactive, -10 0
bind = , escape, submap, reset
submap = reset

bind = SUPER, R, submap, resize
