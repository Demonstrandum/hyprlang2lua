name: hyprland accepts the output

# The claim this project makes is that its output is a config the current Hyprland takes.
# That is checked here against the Hyprland a user would actually have: the package from
# Arch's own repository, running `Hyprland --verify-config`, which parses a config and
# exits without needing a seat or a display.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Hyprland moves; a weekly run says whether the converter still targets the current one
    - cron: "0 6 * * 1"

jobs:
  arch:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-x86_64-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-x86_64-
          gc-max-store-size-linux: 2G

      - name: build the converter
        run: |
          nix develop .#static --command bash -c '
            STATIC=1 PKGS="hyprlang hyprutils" OUT=build/hyprlang2lua ./tools/build.sh
          '
          file build/hyprlang2lua

      - name: run it against Arch's hyprland package
        run: |
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed hyprland diffutils > /dev/null
            echo "arch package: $(pacman -Q hyprland)"
            # Hyprland refuses to run with superuser privileges and --verify-config takes
            # the same path, so the check runs as an ordinary user, like a real one would
            useradd --create-home check
            install -d -o check -m 700 /tmp/xdg
            su check -c "XDG_RUNTIME_DIR=/tmp/xdg ./tools/verify-with-hyprland.sh"
          '

      - name: report the version it was checked against
        if: always()
        run: |
          docker run --rm archlinux:latest bash -c '
            pacman -Sy > /dev/null 2>&1
            pacman -Si hyprland | grep -E "^(Name|Version|Repository)"
          '

  aur:
    # The packaging is checked the way a user would meet it: makepkg builds the PKGBUILD
    # on Arch, pacman installs the result, and the installed binary converts a config that
    # Arch's own hyprland then accepts.
    runs-on: ubuntu-24.04
    needs: arch

    strategy:
      fail-fast: false
      matrix:
        pkgbuild: [PKGBUILD, hyprlang2lua-bin.PKGBUILD]

    steps:
      - uses: actions/checkout@v4

      - name: makepkg, install, convert, verify
        run: |
          docker run --rm -v "$PWD:/src:ro" archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed base-devel git hyprland sudo > /dev/null
            useradd --create-home build
            # makepkg installs missing dependencies through sudo, and refuses to run as root
            echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build
            install -o build -m 644 /src/packaging/aur/${{ matrix.pkgbuild }} /home/build/PKGBUILD
            cd /home/build

            echo "==> makepkg"
            su build -c "makepkg --noconfirm --syncdeps --clean"

            echo "==> pacman -U"
            pacman -U --noconfirm /home/build/*.pkg.tar.zst

            echo "==> installed:"
            pacman -Qi hyprlang2lua hyprlang2lua-bin 2>/dev/null | grep -E "^(Name|Version|Installed Size)" || true
            command -v hyprlang2lua

            echo "==> convert and verify"
            install -d -o build -m 700 /tmp/xdg
            cp /src/test/fixtures/upstream-example.conf /home/build/
            chown build /home/build/upstream-example.conf
            su build -c "cd /home/build && hyprlang2lua upstream-example.conf -o out.lua && XDG_RUNTIME_DIR=/tmp/xdg Hyprland --verify-config -c /home/build/out.lua"
            echo "==> the packaged binary produced a config this Hyprland accepts"
          '
